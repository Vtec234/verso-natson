name: Blueprint Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: leanprover/verso-blueprint/.github/workflows/blueprint-pages.yml@44f0a55c03f512e4e11cc38f8b58dd9b90298b2d
    with:
      checkout_submodules: true
      harness_enabled: true
      warm_dependency_cache: true
    secrets: inherit
